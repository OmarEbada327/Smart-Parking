<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Rakna</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">RAKNA</span>
      <span class="brand-sub">Operations center</span>
    </div>

    <h1>Create an account</h1>
    <p class="lead">Create an account to access the live parking operations center.</p>

    <div id="formMsg" class="form-msg error" hidden></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />
        <div class="field-error" id="nameError" hidden></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <div class="field-error" id="emailError" hidden></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required />
        <div class="field-error" id="passwordError" hidden></div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
